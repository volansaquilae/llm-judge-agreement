# Publishes to PyPI through PyPI's trusted publishing, so no token is stored anywhere.
# Runs on every push to main. A version that's already on PyPI is skipped, so bump the version to release.
name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          python -m pip install --upgrade pip build pytest
          python -m pip install .
          python -m pytest -q
      - name: Build
        run: python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
